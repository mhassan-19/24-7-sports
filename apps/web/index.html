<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#141416" />
    <meta name="description" content="نتائج مباريات كرة القدم، الترتيب، الانتقالات والأخبار على مدار الساعة." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>24/7 Sports</title>
    <script>
      // Apply the saved theme and language before first paint (no flash of the wrong theme).
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem('sports247.prefs') || '{}').state || {};
          var theme = p.theme || 'dark';
          document.documentElement.dataset.theme = theme;
          var lang = location.pathname.split('/')[1];
          if (lang === 'en' || lang === 'ar') {
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html { background: #141416; }
      html[data-theme='light'] { background: #f5f3ef; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>24/7 Sports needs JavaScript to show live scores.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
